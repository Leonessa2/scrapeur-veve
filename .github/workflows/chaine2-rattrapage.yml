# ⚠️ DEPOT : Leonessa2/scrapeur-veve   ·   CHEMIN : .github/workflows/chaine2-rattrapage.yml
#
# 🔗 RATTRAPAGE CHAINE 2 — A LANCER UNE FOIS, A LA MAIN (go de Preda, 27/11/2026).
# CollectChain est repartie a zero le 19/11/2026 13:03 UTC ; depuis, le
# collecteur quotidien ne voyait plus rien. Cette tache :
#   1. collecte le 19/11 13:03 UTC -> fin de la veille PT, SANS les ~13 M
#      recreations de la migration (scraper/chaine2.py) ;
#   2. ajoute les journees manquantes a la release `chain-archive-daily`
#      (NOUVEAUX fichiers : une journee deja presente n'est jamais reecrite) ;
#   3. range les mints « stock » (sans metadonnee) a part, release `chaine2-stock` ;
#   4. complete les onglets ChainActivity / ChainItems / _ListingDaily du Sheet,
#      le registre wallets, la page 📊 STATS, et pose le point de reprise en
#      numeros de la chaine 2 : le quotidien reprend tout seul ensuite.
# ⚠️ AVANT : lancer `discord.yml` (modules=retour, purger_retour=true), sinon le
#    Hub publierait d'un coup les cartes « retour » en retard (condition de Preda).
name: Rattrapage chaine 2 (une fois)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: veve-daily          # jamais en meme temps que le daily ni le rattrapage chain
  cancel-in-progress: false

jobs:
  rattrapage:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      SHEET_ID: ${{ secrets.SHEET_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Etat le plus recent
        run: git pull --rebase origin main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Dependances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Journees deja dans chain-archive-daily (jamais reecrites)
        run: |
          J=$(gh release view chain-archive-daily --json assets -q '.assets[].name' \
              | sed -n 's/^transfers_daily_\([0-9-]*\)\.csv\.gz$/\1/p' | paste -sd, -)
          echo "CHAIN2_JOURS_DEJA=$J" >> "$GITHUB_ENV"
          echo "Deja publiees : $(echo "$J" | tr ',' '\n' | wc -l) journee(s), derniere : $(echo "$J" | tr ',' '\n' | sort | tail -1)"

      - name: 1) Collecte chaine 2 + Sheet + archive locale
        env:
          CHAIN_MODE: rattrapage2
        run: python -m scraper.chain_run

      - name: 2) Archive -> chain-archive-daily (nouveaux fichiers seulement)
        run: |
          ls archive/transfers_daily_*.csv.gz >/dev/null 2>&1 || { echo "Rien a ajouter."; exit 0; }
          for f in archive/transfers_daily_*.csv.gz; do
            j=$(basename "$f")
            if gh release view chain-archive-daily --json assets -q '.assets[].name' | grep -qx "$j"; then
              echo "⛔ $j existe deja : NON reecrit."; continue
            fi
            gh release upload chain-archive-daily "$f"      # sans --clobber : volontaire
            echo "✅ ajoute : $j ($(zcat "$f" | tail -n +2 | wc -l) transferts)"
          done

      - name: 3) Stock chaine 2 -> release chaine2-stock (lue par personne)
        run: |
          ls archive_stock/*.csv.gz >/dev/null 2>&1 || { echo "Pas de stock."; exit 0; }
          gh release view chaine2-stock >/dev/null 2>&1 || \
            gh release create chaine2-stock --title "Chaine 2 : mints stock (sans metadonnee)" \
              --notes "Mints de la chaine 2 sans nom ni image, crees dans des portefeuilles de VeVe. Classes A PART de chain-archive-daily (decision de Preda, 27/11/2026). Lus par aucun site."
          gh release upload chaine2-stock archive_stock/*.csv.gz --clobber

      - name: 4) Registre wallets
        run: python -m scraper.wallet_registry

      - name: 5) Commit registre wallets (data/)
        run: |
          [ -f data/wallet_registry_daily.csv ] || { echo "Rien a committer."; exit 0; }
          git config user.name "veve-catchup-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/wallet_registry_daily.csv
          if git diff --cached --quiet; then echo "Rien a committer."; exit 0; fi
          git commit -m "registry: rattrapage chaine 2"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            sleep $((i * 5))
          done

      - name: 6) Page 📊 STATS
        run: python -m scraper.stats_page
